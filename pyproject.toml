[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "surrealengine.surrealengine_accelerator"
python-source = "src"

[project]
name = "surrealengine"
version = "2.0.0"
description = "A powerful, asynchronous Object-Graph Mapper (OGM) and utility library for SurrealDB."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT License"}
authors = [
    {name = "Iristech Systems"}
]
keywords = ["surrealdb", "odm", "database", "async", "orm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
]

# Core dependencies - minimal set required for basic functionality
dependencies = [
    # 3.0.0b7 is the first release whose embedded engine runs surrealdb-core 3.x,
    # which is what makes local (mem://, file://, surrealkv://) and remote agree
    # on the 3.0 feature set. It is also a breaking API change from 2.x - see
    # 3_0_update-path.md. Pinned below 4 because 3.x is still pre-release.
    "surrealdb>=3.0.0b7,<4",     # Core SurrealDB client
    "typing-extensions>=4.12.0", # Typing support for older Python
    "cbor2>=5.6.0",              # CBOR serialization
    # The SDK's own floor. websockets.sync needs >=11.0; 11.0 deadlocks on close
    # with an undelivered live notification; 12.0-13.1 pay the full 10s close
    # timeout for it; 14.0 is the first with an immediate close, and 14.1 the
    # first to expose ClientConnection.state.
    "websockets>=14.1",          # WebSocket support
]

[project.optional-dependencies]
# Embedded SurrealDB engine (mem://, file://, surrealkv://, surrealkv+versioned://).
# As of surrealdb 3.0 this is a separate native distribution rather than part of
# the main wheel, so it has to be asked for explicitly. Required for the local
# half of SyncManager's local/remote read routing.
embedded = [
    "surrealdb[embedded]>=3.0.0b7,<4",
]

# Signals support (pre/post save hooks, etc.)
signals = [
    "blinker>=1.6.2",
]

# Zero-copy data acceleration (PyArrow, Polars)
data = [
    "pyarrow>=14.0.0",
    "polars>=0.20.0",
]

# Jupyter notebook integration
jupyter = [
    "notebook>=7.0.0",
    "ipykernel>=6.0.0",
]

# Development dependencies
dev = [
    "maturin>=1.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.4.0",
]

# Everything - for full-featured installations
all = [
    "surrealengine[embedded,signals,data,jupyter]",
]

[project.urls]
"Homepage" = "https://github.com/iristech-systems/surrealengine"
"Bug Tracker" = "https://github.com/iristech-systems/surrealengine/issues"
"Documentation" = "https://github.com/iristech-systems/surrealengine#readme"

[dependency-groups]
dev = [
    "maturin>=1.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py310"
exclude = [
    "surrealdb_documentation",
    "example_scripts",
    "notebooks",
    "tests",
    "verify_*.py",
    "jupyter_lab_config.py",
    "benchmark_zero_copy.py",
]

[tool.pyrefly]
exclude = [
    "surrealdb_documentation",
    "example_scripts",
    "notebooks",
    "tests",
    "verify_*.py",
    "jupyter_lab_config.py",
    "benchmark_zero_copy.py",
]

[tool.uv]
prerelease = "allow"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=surrealdb_documentation"
